services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: manabu
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: manabu
    ports:
      - "5432:5432"
    volumes:
      - manabu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manabu"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  manabu-pgdata:
    external: true
